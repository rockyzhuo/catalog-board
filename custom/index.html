<!DOCTYPE html>
<html lang="zh-CN" data-theme="mist">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e8f1fb" />
  <title>示例定制店 · 选择版本</title>
  <link rel="stylesheet" href="style.css" />
  <meta http-equiv="refresh" content="0; url=full/" />
  <script>location.replace('full/' + location.search + location.hash);</script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-title">示例定制店</div>
        <div class="brand-sub">定制版入口</div>
      </div>
      <span class="badge">定制</span>
    </div>
  </header>
  <div class="theme-bar" role="group" aria-label="专属模板">
    <span class="theme-bar-label">专属模板</span>
    <button type="button" class="theme-pill" data-theme-btn="mist" aria-pressed="true">清爽蓝</button>
    <button type="button" class="theme-pill" data-theme-btn="noir" aria-pressed="false">深金夜</button>
    <button type="button" class="theme-pill" data-theme-btn="poster" aria-pressed="false">海报红</button>
  </div>
  <main class="page">
    <section class="intro card">
      <h1>选择定制版本</h1>
      <p>完整版含主站全部价目文案；预览版仅展示部分热门 SKU，适合当作样板店入口。</p>
      <p class="warn-line"><strong>18+</strong> · 禁止向未成年人传播</p>
      <div class="chooser">
        <a href="full/"><strong>完整版 →</strong><span>全部产品文案 + 价格 + 图册（与主站一致）</span></a>
        <a href="partial/"><strong>预览版 →</strong><span>6 款热门 SKU 预览（SONG / GOwif / 冰熊 / Snowplus）</span></a>
      </div>
    </section>
  </main>
  <footer class="footer">
    <p>若未自动跳转，请点击上方「完整版」</p>
  </footer>
  <script src="app.js" defer></script>
</body>
</html>
